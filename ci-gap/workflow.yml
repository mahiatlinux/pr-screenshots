        \ ]; then\n  npm ci --prefix studio/frontend\nfi\npython -m pip install 'pillow>=10,<13'\nexport PW_BACKEND_PYTHON=\"\
        $HOME/.unsloth/studio/unsloth_studio/bin/python\"\npython tests/studio/playwright_mtp_download_visibility.py\n"
    - name: Reset auth + boot Unsloth
